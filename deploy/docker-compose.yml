services:
  postgres:
    image: postgres:16-alpine
    container_name: pinball-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-pinball_db}
      - POSTGRES_USER=${POSTGRES_USER:-pinball_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: [ "pnpm", "run", "db:migrate" ]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pinball_user}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-pinball_db}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-change_me_with_a_long_random_secret}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-http://localhost}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SCORE_CLAIM_MODE=${SCORE_CLAIM_MODE:-local}
      - GLOBAL_API_URL=${GLOBAL_API_URL:-}
      - BORNE_TOKEN=${BORNE_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pinball_user}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-pinball_db}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-change_me_with_a_long_random_secret}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-http://localhost}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SCORE_CLAIM_MODE=${SCORE_CLAIM_MODE:-local}
      - GLOBAL_API_URL=${GLOBAL_API_URL:-}
      - BORNE_TOKEN=${BORNE_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: always

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3000}
        - VITE_MQTT_USERNAME=${MQTT_USERNAME:-pinball_user}
        - VITE_MQTT_PASSWORD=${MQTT_PASSWORD:-change_me}
        - VITE_MQTT_URL=${MQTT_URL:-}
    ports:
      - "80:80"
    restart: always

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: mosquitto
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME:-pinball_user}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-change_me}
    # On génère le fichier dans /config/ et on donne les droits à l'utilisateur mosquitto
    entrypoint: >
      sh -c "touch /mosquitto/config/password_file.txt && 
             mosquitto_passwd -b /mosquitto/config/password_file.txt $$MQTT_USERNAME $$MQTT_PASSWORD && 
             chown 1883:1883 /mosquitto/config/password_file.txt &&
             chmod 600 /mosquitto/config/password_file.txt &&
             echo 'MQTT user created' && 
             exec mosquitto -c /mosquitto/config/mosquitto.conf"
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ../mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: always

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
