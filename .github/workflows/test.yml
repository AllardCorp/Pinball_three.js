name: Tests & Coverage

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    name: Tests unitaires & couverture
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Installation de pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Installation des dépendances
        run: pnpm install --frozen-lockfile

      - name: Lancement des tests
        run: pnpm test

      - name: Vérification de la couverture (seuil 80%)
        run: pnpm coverage

  deploy-vps:
    name: Déploiement VPS après tests
    needs: test
    # Déploiement de validation uniquement pour la branche VPS.
    # Les pull requests exécutent les tests mais ne déploient pas.
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/configuration-vps'
    runs-on: ubuntu-latest
    environment: VPS_ENV

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Synchronisation des fichiers vers le VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.env' --exclude='.git' --exclude='node_modules'
          path: ./
          remote_path: ~/flipper-project/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USERNAME }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Redémarrage Docker Compose VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/flipper-project

            test -f .env || {
              echo "Erreur: .env est manquant dans ~/flipper-project"
              exit 1
            }

            sudo docker compose --env-file .env -p flipper-project -f deploy/docker-compose.vps.yml up -d --build
            sudo docker image prune -f
            sudo docker compose --env-file .env -p flipper-project -f deploy/docker-compose.vps.yml ps
